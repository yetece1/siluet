name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      packages_branch:
        description: "Also push the built packages to the 'packages' branch"
        type: boolean
        default: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Dependencies
        run: python -m pip install "pyinstaller>=6,<7" -r requirements.txt
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests -p no:cacheprovider
      - name: Package
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --distpath dist --workpath build/work packaging/siluet.spec
          Copy-Item packaging/windows/KURULUM.txt dist/Siluet/
          Copy-Item LICENSE dist/Siluet/LICENSE.txt
          Compress-Archive -Path dist/Siluet -DestinationPath dist/Siluet-windows.zip -Force
      - name: Launch smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/Siluet/Siluet.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Get-Content "$env:LOCALAPPDATA/Siluet/*.log" -ErrorAction SilentlyContinue; throw "The app exited right after launch (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v4
        with:
          name: Siluet-windows
          path: dist/Siluet-windows.zip

  linux:
    # Older base system: the package then runs on newer distributions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: System libraries for tests and the launch check
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-image0 libxcb-render-util0 xvfb
      - name: Build
        run: PYTHON=python bash build_linux.sh
      - name: Launch smoke test (X11)
        run: |
          code=0
          xvfb-run -a timeout 15 dist/Siluet/Siluet || code=$?
          # 124: still running after 15 s and stopped by timeout (expected)
          if [ "$code" -ne 124 ]; then cat ~/.local/state/Siluet/*.log || true; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Siluet-linux
          path: dist/Siluet-linux.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum Siluet-windows.zip Siluet-linux.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk '/^## /{n++} n==1' CHANGELOG.md)
          files="artifacts/Siluet-windows.zip artifacts/Siluet-linux.tar.gz artifacts/SHA256SUMS.txt"
          # The release may already exist when it was created from the web page.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" $files --clobber
            gh release edit "${GITHUB_REF_NAME}" --title "Silüet ${GITHUB_REF_NAME}" --notes "$notes"
          else
            gh release create "${GITHUB_REF_NAME}" $files --title "Silüet ${GITHUB_REF_NAME}" --notes "$notes"
          fi

  packages-branch:
    if: github.event_name == 'workflow_dispatch' && inputs.packages_branch
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Push to the packages branch
        run: |
          cd out
          sha256sum * > SHA256SUMS.txt
          git init -q -b packages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Packages: ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" packages
